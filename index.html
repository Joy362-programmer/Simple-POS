<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SimplePOS - Kasir Digital Minimalis</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        
        :root {
            --primary: #2563eb;
            --bg-main: #f8fafc;
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-main);
            color: #1e293b;
        }

        .custom-scrollbar::-webkit-scrollbar { width: 5px; height: 5px; }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }

        .product-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            padding: 1rem;
            border-radius: 1rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.25s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .product-card:hover {
            border-color: var(--primary);
            box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.1);
            transform: translateY(-4px);
        }

        .hidden-view { display: none !important; }
        
        .nav-link.active {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
        }

        @media print {
            body * { visibility: hidden; }
            #receipt-content, #receipt-content * { visibility: visible; }
            #receipt-content { 
                position: absolute; left: 0; top: 0; width: 100%;
                background: white;
            }
        }
    </style>
</head>
<body class="h-screen flex flex-col md:flex-row overflow-hidden">

    <!-- Landing Screen -->
    <div id="landing-view" class="fixed inset-0 z-[100] bg-white flex flex-col items-center justify-center p-6 text-center">
        <div class="w-20 h-20 bg-blue-600 rounded-3xl flex items-center justify-center text-white text-3xl mb-8 shadow-2xl animate-bounce">
            <i class="fas fa-store"></i>
        </div>
        <h1 class="text-5xl font-black mb-4 tracking-tighter text-slate-900">Simple<span class="text-blue-600">POS.</span></h1>
        <p class="text-slate-500 mb-10 max-w-sm">Aplikasi kasir ringan untuk efisiensi bisnis Anda.</p>
        <button onclick="switchView('app')" class="bg-blue-600 hover:bg-blue-700 text-white px-12 py-4 rounded-2xl font-bold shadow-xl transition-all">
            Mulai Berjualan
        </button>
    </div>

    <!-- Sidebar -->
    <aside class="w-full md:w-64 bg-white border-b md:border-r border-slate-200 flex flex-col shrink-0 z-50">
        <div class="p-6 hidden md:block">
            <span class="text-2xl font-black tracking-tighter text-slate-800">Simple<span class="text-blue-600">POS.</span></span>
        </div>
        <nav class="flex md:flex-col p-2 md:p-4 gap-2 flex-grow">
            <button onclick="switchTab('pos')" id="tab-btn-pos" class="nav-link active flex-grow md:flex-grow-0 flex items-center gap-3 px-4 py-3 rounded-xl font-bold text-sm transition-all">
                <i class="fas fa-cash-register"></i> <span>Kasir</span>
            </button>
            <button onclick="switchTab('inventory')" id="tab-btn-inventory" class="nav-link flex-grow md:flex-grow-0 flex items-center gap-3 px-4 py-3 rounded-xl font-bold text-sm text-slate-500 hover:bg-slate-50 transition-all">
                <i class="fas fa-boxes"></i> <span>Stok</span>
            </button>
        </nav>
    </aside>

    <main class="flex-grow flex flex-col min-w-0">
        <header class="h-16 md:h-20 bg-white border-b border-slate-200 px-6 flex items-center justify-between shrink-0">
            <div class="flex items-center gap-4 flex-grow max-w-2xl">
                <h2 id="page-title" class="font-bold text-slate-800 border-r pr-4 mr-2">Kasir</h2>
                <div class="relative flex-grow" id="search-container">
                    <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input type="text" id="product-search" oninput="handleSearch()" placeholder="Cari produk..." class="w-full bg-slate-100 rounded-xl py-2.5 pl-11 pr-4 outline-none focus:bg-white focus:ring-2 focus:ring-blue-100 transition-all">
                </div>
            </div>
            <div id="clock" class="hidden sm:block text-xs font-bold text-slate-400"></div>
        </header>

        <!-- POS Tab -->
        <div id="tab-pos" class="flex-grow flex flex-col lg:flex-row overflow-hidden p-4 md:p-6 gap-6">
            <div class="flex-grow overflow-y-auto custom-scrollbar">
                <div class="grid grid-cols-2 sm:grid-cols-3 xl:grid-cols-4 gap-4" id="pos-product-list"></div>
            </div>

            <!-- Cart Section -->
            <div class="w-full lg:w-96 bg-white rounded-2xl border border-slate-200 flex flex-col shadow-sm shrink-0 overflow-hidden">
                <div class="p-5 border-b bg-slate-50/50 flex justify-between items-center">
                    <h3 class="font-bold text-slate-700"><i class="fas fa-shopping-cart mr-2 text-blue-600"></i>Keranjang</h3>
                    <button onclick="clearCart()" class="text-[10px] font-bold text-red-500 uppercase">Reset</button>
                </div>
                <div id="cart-items" class="flex-grow overflow-y-auto p-4 space-y-3 custom-scrollbar"></div>
                <div class="p-6 border-t">
                    <div class="flex justify-between items-end mb-6">
                        <div>
                            <span class="text-[10px] font-bold text-slate-400 uppercase">Total</span>
                            <div id="total-price" class="text-3xl font-black text-slate-900">Rp 0</div>
                        </div>
                    </div>
                    <button onclick="processCheckout()" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-bold shadow-lg shadow-blue-200 active:scale-95 transition-transform">
                        BAYAR
                    </button>
                </div>
            </div>
        </div>

        <!-- Inventory Tab -->
        <div id="tab-inventory" class="hidden-view flex-grow p-4 md:p-8 overflow-y-auto custom-scrollbar">
            <div class="max-w-5xl mx-auto">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-black text-slate-800">Manajemen Stok</h2>
                    <button onclick="openProductModal()" class="bg-slate-900 text-white px-6 py-3 rounded-xl font-bold text-sm shadow-xl">
                        + Tambah Produk
                    </button>
                </div>
                <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm">
                    <table class="w-full text-left">
                        <thead class="bg-slate-50 border-b">
                            <tr>
                                <th class="p-5 text-[10px] font-bold text-slate-400 uppercase">Produk</th>
                                <th class="p-5 text-[10px] font-bold text-slate-400 uppercase text-right">Harga</th>
                                <th class="p-5 text-[10px] font-bold text-slate-400 uppercase text-center">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="inventory-list" class="divide-y divide-slate-50"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal Receipt -->
    <div id="receipt-modal" class="fixed inset-0 z-[110] bg-slate-900/60 backdrop-blur-md hidden items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-3xl overflow-hidden shadow-2xl flex flex-col">
            <div id="receipt-content" class="p-10 font-mono text-xs">
                <div class="text-center mb-4">
                    <h2 class="text-lg font-bold">SIMPLE POS</h2>
                    <p>Terima Kasih Atas Kunjungan Anda</p>
                    <div class="border-b-2 border-dashed my-4"></div>
                </div>
                <div id="rec-items" class="space-y-2"></div>
                <div class="border-b-2 border-dashed my-4"></div>
                <div class="flex justify-between font-bold text-sm">
                    <span>TOTAL</span>
                    <span id="rec-total"></span>
                </div>
            </div>
            <div class="p-6 bg-slate-50 border-t flex gap-3">
                <button onclick="window.print()" class="flex-grow bg-white border py-3 rounded-xl font-bold text-sm">CETAK</button>
                <button onclick="closeReceipt()" class="flex-grow bg-blue-600 text-white py-3 rounded-xl font-bold text-sm">TUTUP</button>
            </div>
        </div>
    </div>

    <!-- Modal Product Form -->
    <div id="product-modal" class="fixed inset-0 z-[120] bg-slate-900/60 backdrop-blur-sm hidden items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-3xl p-8">
            <h4 id="modal-title" class="text-xl font-black mb-6">Produk</h4>
            <div class="space-y-4">
                <input type="hidden" id="edit-id">
                <input type="text" id="prod-name" placeholder="Nama Produk" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-blue-100">
                <input type="number" id="prod-price" placeholder="Harga" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-blue-100">
                <div class="flex gap-2 pt-4">
                    <button onclick="closeProductModal()" class="flex-grow bg-slate-100 py-3 rounded-xl font-bold text-sm">Batal</button>
                    <button onclick="saveProduct()" class="flex-grow bg-blue-600 text-white py-3 rounded-xl font-bold text-sm">Simpan</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Data Produk Awal
        let products = [
            { id: 1, name: "Beras Premium 5kg", price: 78500 },
            { id: 2, name: "Minyak Goreng 2L", price: 34000 },
            { id: 3, name: "Gula Pasir 1kg", price: 16500 },
            { id: 4, name: "Telur Ayam 1kg", price: 28000 },
            { id: 5, name: "Terigu 1kg", price: 12500 },
            { id: 10, name: "Susu UHT 1L", price: 18500 },
            { id: 15, name: "Air Mineral 600ml", price: 3500 },
            { id: 20, name: "Margarin 200g", price: 8500 }
        ];

        let cart = [];
        let searchTerm = "";

        // Navigation
        function switchView(view) {
            document.getElementById('landing-view').classList.toggle('hidden-view', view === 'app');
        }

        function switchTab(tab) {
            const isPos = tab === 'pos';
            document.getElementById('tab-pos').classList.toggle('hidden-view', !isPos);
            document.getElementById('tab-inventory').classList.toggle('hidden-view', isPos);
            document.getElementById('search-container').classList.toggle('invisible', !isPos);
            
            document.getElementById('tab-btn-pos').classList.toggle('active', isPos);
            document.getElementById('tab-btn-inventory').classList.toggle('active', !isPos);
            
            document.getElementById('page-title').innerText = isPos ? 'Kasir' : 'Stok';
            refreshAll();
        }

        // Logic POS
        function handleSearch() {
            searchTerm = document.getElementById('product-search').value.toLowerCase();
            renderPos();
        }

        function renderPos() {
            const list = document.getElementById('pos-product-list');
            const filtered = products.filter(p => p.name.toLowerCase().includes(searchTerm));
            
            list.innerHTML = filtered.map(p => `
                <div onclick="addToCart(${p.id})" class="product-card">
                    <h4 class="font-bold text-slate-800 text-sm mb-2">${p.name}</h4>
                    <p class="text-blue-600 font-black">Rp ${p.price.toLocaleString('id-ID')}</p>
                </div>
            `).join('');
        }

        function addToCart(id) {
            const prod = products.find(p => p.id === id);
            const item = cart.find(i => i.id === id);
            if(item) item.qty++; else cart.push({...prod, qty: 1});
            renderCart();
        }

        function renderCart() {
            const container = document.getElementById('cart-items');
            container.innerHTML = cart.length === 0 ? 
                '<div class="text-center py-10 text-slate-300 text-xs">Keranjang Kosong</div>' :
                cart.map(i => `
                    <div class="flex justify-between items-center bg-slate-50 p-3 rounded-xl border border-slate-100">
                        <div class="min-w-0 pr-2">
                            <p class="text-xs font-bold truncate">${i.name}</p>
                            <p class="text-[10px] text-blue-600 font-bold">Rp ${(i.price * i.qty).toLocaleString('id-ID')}</p>
                        </div>
                        <div class="flex items-center gap-2">
                            <button onclick="updateQty(${i.id}, -1)" class="w-6 h-6 bg-white rounded-md text-[10px] shadow-sm">-</button>
                            <span class="text-xs font-bold w-4 text-center">${i.qty}</span>
                            <button onclick="updateQty(${i.id}, 1)" class="w-6 h-6 bg-white rounded-md text-[10px] shadow-sm">+</button>
                        </div>
                    </div>
                `).join('');
            
            const total = cart.reduce((acc, curr) => acc + (curr.price * curr.qty), 0);
            document.getElementById('total-price').innerText = `Rp ${total.toLocaleString('id-ID')}`;
        }

        function updateQty(id, delta) {
            const idx = cart.findIndex(i => i.id === id);
            cart[idx].qty += delta;
            if(cart[idx].qty <= 0) cart.splice(idx, 1);
            renderCart();
        }

        function clearCart() { cart = []; renderCart(); }

        // Checkout & Receipt
        function processCheckout() {
            if(cart.length === 0) return;
            const total = cart.reduce((acc, curr) => acc + (curr.price * curr.qty), 0);
            document.getElementById('rec-items').innerHTML = cart.map(i => `
                <div class="flex justify-between">
                    <span>${i.name} x${i.qty}</span>
                    <span>${(i.price * i.qty).toLocaleString('id-ID')}</span>
                </div>
            `).join('');
            document.getElementById('rec-total').innerText = 'Rp ' + total.toLocaleString('id-ID');
            document.getElementById('receipt-modal').classList.replace('hidden', 'flex');
        }

        function closeReceipt() {
            clearCart();
            document.getElementById('receipt-modal').classList.replace('flex', 'hidden');
        }

        // Inventory
        function renderInventory() {
            const list = document.getElementById('inventory-list');
            list.innerHTML = products.map(p => `
                <tr>
                    <td class="p-5 font-bold text-sm">${p.name}</td>
                    <td class="p-5 text-right font-black text-blue-600">Rp ${p.price.toLocaleString('id-ID')}</td>
                    <td class="p-5">
                        <div class="flex justify-center gap-2">
                            <button onclick="editProduct(${p.id})" class="text-blue-500 hover:bg-blue-50 p-2 rounded-lg transition-colors"><i class="fas fa-edit"></i></button>
                            <button onclick="deleteProduct(${p.id})" class="text-red-500 hover:bg-red-50 p-2 rounded-lg transition-colors"><i class="fas fa-trash"></i></button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        function openProductModal() {
            document.getElementById('edit-id').value = "";
            document.getElementById('prod-name').value = "";
            document.getElementById('prod-price').value = "";
            document.getElementById('modal-title').innerText = "Produk Baru";
            document.getElementById('product-modal').classList.replace('hidden', 'flex');
        }

        function closeProductModal() {
            document.getElementById('product-modal').classList.replace('flex', 'hidden');
        }

        function saveProduct() {
            const id = document.getElementById('edit-id').value;
            const name = document.getElementById('prod-name').value;
            const price = parseInt(document.getElementById('prod-price').value);

            if(!name || !price) return;

            if(id) {
                const idx = products.findIndex(p => p.id == id);
                products[idx] = { id: parseInt(id), name, price };
            } else {
                products.push({ id: Date.now(), name, price });
            }
            closeProductModal();
            refreshAll();
        }

        function editProduct(id) {
            const p = products.find(prod => prod.id === id);
            document.getElementById('edit-id').value = p.id;
            document.getElementById('prod-name').value = p.name;
            document.getElementById('prod-price').value = p.price;
            document.getElementById('modal-title').innerText = "Edit Produk";
            document.getElementById('product-modal').classList.replace('hidden', 'flex');
        }

        function deleteProduct(id) {
            if(confirm('Hapus produk ini?')) {
                products = products.filter(p => p.id !== id);
                refreshAll();
            }
        }

        function refreshAll() {
            renderPos();
            renderInventory();
        }

        // Clock & Init
        setInterval(() => {
            const clock = document.getElementById('clock');
            const now = new Date();
            clock.innerText = now.toLocaleString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' });
        }, 1000);

        window.onload = refreshAll;
    </script>
</body>
</html>
